[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-risk"
version = "1.0.0"
description = "COVID-19 30-day mortality risk model at first attendance, built on Mexico's national line list (3.9M patients) and validated over time and across states"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muneera Mohamed" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]
dev = ["pytest>=8", "ruff>=0.5", "shap>=0.46", "pytest-github-actions-annotate-failures>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 190
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
